function buildRadar(scores) {
  const cx=120,cy=115,r=85,n=scores.length;
  const angle=i=>(Math.PI*2*i/n)-Math.PI/2;
  const pt=(i,pct)=>{const a=angle(i),d=r*(pct/100);return[cx+d*Math.cos(a),cy+d*Math.sin(a)];};
  const grid=[25,50,75,100].map(p=>scores.map((_,i)=>pt(i,p)).map(([x,y],j)=>(j===0?'M'+x+','+y:'L'+x+','+y)).join(' ')+' Z');
  const dataPath=scores.map((_,i)=>pt(i,scores[i]||0)).map(([x,y],j)=>(j===0?'M'+x+','+y:'L'+x+','+y)).join(' ')+' Z';
  const gridPaths=grid.map(d=>'<path d="'+d+'" fill="none" stroke="rgba(201,169,110,0.2)" stroke-width="0.8"/>').join('');
  const axes=scores.map((_,i)=>{const[x,y]=pt(i,100);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="rgba(201,169,110,0.2)" stroke-width="0.8"/>';}).join('');
  const shape='<path d="'+dataPath+'" fill="rgba(201,169,110,0.14)" stroke="#C9A96E" stroke-width="1.5"/>';
  const lbls=scores.map((_,i)=>{const[x,y]=pt(i,122);return '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#EDE8DC" font-family="Georgia,serif" opacity="0.75">'+DIMS[i]+'</text>';}).join('');
  return '<svg viewBox="0 0 240 235" width="220" height="215">'+gridPaths+axes+shape+lbls+'</svg>';
}

// ─── STATE ───────────────────────────────────────────────────────────────────

function totalScore() { return answers.reduce((a,b) => a + (b||0), 0); }

function dimScores() {
  return DIM_Q.map(idxs => {
    const sum = idxs.reduce((a,i) => a + (answers[i]||0), 0);
    return Math.round(sum / (idxs.length * 4) * 100);
  });
}

function getProfile() {
  const t = totalScore();
  return PROFILES.find(p => t >= p.min && t <= p.max) || PROFILES[0];
}

function getPct() { return Math.round(((totalScore()-10)/30)*100); }

function getDimAdvice(dimIdx, pct) {
  const a = DIM_ADVICE[dimIdx];
  return pct >= 70 ? a.sterk : pct >= 40 ? a.mid : a.zwak;
}

function updateProgress() {
  if (step === 0) { pFill.style.width = '0%'; return; }
  if (step >= 12) { pFill.style.width = '100%'; return; }
  pFill.style.width = Math.round((step / 12) * 100) + '%';
}

function goTo(n) {
  step = n;
  updateProgress();
  stage.innerHTML = '';
  if (step === 0) renderIntro();
  else if (step >= 1 && step <= 10) renderQuestion(step - 1);
  else if (step === 11) renderContact();
  else renderResults();
  window.scrollTo({ top: 0 });
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const L = ['A','B','C','D'];
  const opts = q.opts.map((o,i) => `
    <button class="qs-opt${answers[idx]===i+1?' selected':''}" onclick="selectAnswer(${idx},${i+1})">
      <span class="qs-opt-letter">${L[i]}</span>
      <span class="qs-opt-text">${o}</span>
    </button>`).join('');
  stage.innerHTML = `<div class="qs-step">
    <div class="qs-dim-label">Dimensie ${q.dn} van 5 — ${q.dim}</div>
    <div class="qs-qnum">Vraag ${idx+1} van 10</div>
    <div class="qs-q">${q.q}</div>
    <div class="qs-options">${opts}</div>
    ${step>1?`<button class="qs-back" onclick="goTo(${step-1})">← Vorige vraag</button>`:''}
  </div>`;
}

function selectAnswer(idx, score) {
  answers[idx] = score;
  document.querySelectorAll('.qs-opt').forEach((el,i) => {
    const sel = i+1 === score;
    el.classList.toggle('selected', sel);
    const ltr = el.querySelector('.qs-opt-letter');
    ltr.style.background = sel ? 'var(--gold)' : '';
    ltr.style.color = sel ? 'var(--midnight)' : '';
    ltr.style.borderColor = sel ? 'var(--gold)' : '';
  });
  setTimeout(() => goTo(step + 1), 380);
}

async function submitContact(e) {
  e.preventDefault();
  const name  = document.getElementById('f_name').value.trim();
  const last  = document.getElementById('f_last').value.trim();
  const email = document.getElementById('f_email').value.trim();
  const org   = document.getElementById('f_org').value.trim();
  const role  = document.getElementById('f_role').value.trim();
  const err   = document.getElementById('fErr');
  if (!name||!last||!email||!org) { err.classList.add('show'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent='Vul een geldig e-mailadres in.'; err.classList.add('show'); return; }
  err.classList.remove('show');
  contact = { name, last, email, org, role };

  const prof  = getProfile();
  const ds    = dimScores();
  const total = totalScore();
  const pct   = getPct();

  // Send lead email via FormSubmit.co
  // ⚠️ Eerste gebruik: klik de bevestigingsmail van FormSubmit.co in uw inbox (amir@byamir.ai)
  try {
    await fetch('https://formsubmit.co/ajax/amir@byamir.ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: `Sales Quickscan — ${name} ${last} (${org}) · ${prof.label} · ${pct}%`,
        _template: 'table',
        naam:            `${name} ${last}`,
        email:           email,
        organisatie:     org,
        functie:         role || '—',
        totaal_score:    `${total}/40 (${pct}%)`,
        niveau:          prof.label,
        profiel:         prof.sub,
        'Funnel & ROI':  `${ds[0]}%`,
        'Strategie':     `${ds[1]}%`,
        'Team & Coaching': `${ds[2]}%`,
        'Enablement':    `${ds[3]}%`,
        'Leiderschap':   `${ds[4]}%`,
        samenvatting:    prof.desc
      })
    });
  } catch(_) { /* Rapport altijd tonen, ook als email mislukt */ }

  // Show results immediately with loading state
  aiAdvice = null;
  goTo(12);

  // Build context for AI advice
  const _ds = typeof dimScores === 'function' ? dimScores() : [0,1,2,3,4].map(d=>(answers[d*2]||0)+(answers[d*2+1]||0));
  const _pct = typeof getPct === 'function' ? getPct() : Math.round(((answers.reduce((a,b)=>a+(b||0),0)-10)/30)*100);
  const _prof = typeof getProfile === 'function' ? getProfile() : (PROFILES.find(p=>_pct>=p.range[0]&&_pct<=p.range[1])||PROFILES[0]);
  const _level = _prof.label;
  const _dimSum = ["Funnel & ROI","Strategie","Team & Coaching","Enablement","Leiderschap"].map((d,i)=>d+': '+_ds[i]+'%').join(', ');

  generateAdvice(name, org || company || '', _pct, _level, _dimSum).then(adv => {
    aiAdvice = adv;
    const spinner = document.getElementById('amir-loading');
    const advDiv  = document.getElementById('amir-advice');
    if (spinner) spinner.style.display = 'none';
    if (advDiv)  { advDiv.style.display = 'block'; advDiv.textContent = adv; }
    // Send lead email after advice is ready
    fetch('https://formsubmit.co/ajax/amir@byamir.ai', {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        _subject: 'Sales Quickscan — '+name+' '+(last||'')+' ('+(org||company||'—')+') · '+_level+' · '+_pct+'%',
        _template:'table',
        naam: name+' '+(last||''),
        email: email,
        organisatie: org||company||'—',
        functie: role||'—',
        totaalscore: _pct+'/100',
        niveau: _level,
        dimensies: _dimSum,
        advies: adv.slice(0,600)
      })
    }).catch(()=>{});
  });
}

function generateAdvice(name, company, score, level, dimSummary) {
  const prompt = "Je bent commercieel strategieadviseur bij by AMIR met 20+ jaar ervaring. Schrijf een warm en direct gepersonaliseerd sales-advies in het Nederlands voor {name}{company}.\n\nScore: {score}/100 \u2014 Niveau: {level}\nDimensies: {dimSummary}\n\nSchrijf 3 korte alinea's. Benoem de sterkste en zwakste dimensie concreet. Geef praktisch advies. Sluit af met uitnodiging voor een gesprek met Amir. Spreek {name} aan met 'u'. Geen wolligheid.";
  const filled = prompt
    .replace('{name}', name)
    .replace('{company}', company ? ' van ' + company : '')
    .replace('{score}', score)
    .replace('{level}', level)
    .replace('{dimSummary}', dimSummary);
  if (window.claude && window.claude.complete) {
    return window.claude.complete(filled)
      .catch(() => PROFILES.find(p => p.label === level) ? PROFILES.find(p => p.label === level).desc : PROFILES[0].desc);
  }
  return Promise.resolve(PROFILES.find(p => p.label === level) ? PROFILES.find(p => p.label === level).desc : PROFILES[0].desc);
}
